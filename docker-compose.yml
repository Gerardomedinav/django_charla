services:
  db:
    image: postgres:15-alpine
    container_name: restaurante_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-restaurante_db}
      POSTGRES_USER: ${POSTGRES_USER:-formodev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-formodev_password_segura}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-formodev} -d ${POSTGRES_DB:-restaurante_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: restaurante_web
    restart: unless-stopped
    command: >
      sh -c "python manage.py makemigrations &&
             python manage.py migrate &&
             python manage.py seed_data &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      SECRET_KEY: ${SECRET_KEY:-django-insecure-formo-dev-super-secreta-restaurante-2025-clave-segura}
      DEBUG: ${DEBUG:-True}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-*}
      POSTGRES_DB: ${POSTGRES_DB:-restaurante_db}
      POSTGRES_USER: ${POSTGRES_USER:-formodev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-formodev_password_segura}
      DB_HOST: db
      DB_PORT: 5432
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
