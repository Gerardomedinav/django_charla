<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 270 270" width="100%" height="100%">
  <defs>
    <!-- Gradiente oficial FormoDevs: Verde Neón / Menta a Cian / Celeste Eléctrico -->
    <linearGradient id="formodevs-neon" gradientUnits="userSpaceOnUse" x1="30" y1="20" x2="240" y2="250">
      <stop offset="0%" stop-color="#2feaa8" />
      <stop offset="45%" stop-color="#14e2c2" />
      <stop offset="100%" stop-color="#00b4f0" />
    </linearGradient>
  </defs>

  <!-- Grupo con gradiente unificado en todo el lienzo -->
  <g stroke="url(#formodevs-neon)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    
    <!-- 1. Círculo exterior envolvente -->
    <circle cx="135" cy="135" r="124" stroke-width="8.5" />

    <!-- 2. Orejeras / Auriculares del robot (cápsulas laterales) -->
    <path d="M 48 111 C 28 111 28 159 48 159" stroke-width="8.5" />
    <path d="M 222 111 C 242 111 242 159 222 159" stroke-width="8.5" />

    <!-- 3. Casco exterior (squircle redondeado) -->
    <rect x="48" y="46" width="174" height="178" rx="55" ry="55" stroke-width="8.5" />

    <!-- 4. Líneas divisorias verticales del casco -->
    <!-- Superior izquierda y derecha -->
    <line x1="94" y1="47" x2="94" y2="86" stroke-width="8" />
    <line x1="176" y1="47" x2="176" y2="86" stroke-width="8" />
    <!-- Inferior izquierda y derecha -->
    <line x1="94" y1="184" x2="94" y2="223" stroke-width="8" />
    <line x1="176" y1="184" x2="176" y2="223" stroke-width="8" />

    <!-- 5. Visor / Pantalla facial interior -->
    <rect x="68" y="86" width="134" height="98" rx="32" ry="32" stroke-width="8.5" />

    <!-- 6. Expresión Facial (Rostro Tech: >_ ⌣ {}) -->
    <!-- Ojo izquierdo: Prompt de terminal '>' -->
    <path d="M 85 113 L 102 126 L 85 139" stroke-width="7.5" />
    
    <!-- Guiño / Cursor '_': Guión horizontal -->
    <line x1="107" y1="139" x2="125" y2="139" stroke-width="7.5" />

    <!-- Sonrisa amigable '⌣' -->
    <path d="M 119 154 Q 135 166 151 154" stroke-width="7.5" />

    <!-- Ojo derecho: Llaves de código '{}' -->
    <!-- Llave izquierda '{' -->
    <path d="M 166 111 C 158 113 159 120 159 122 C 159 124 153 125 153 125 C 153 125 159 126 159 128 C 159 130 158 137 166 139" stroke-width="6.8" />
    <!-- Llave derecha '}' -->
    <path d="M 174 111 C 182 113 181 120 181 122 C 181 124 187 125 187 125 C 187 125 181 126 181 128 C 181 130 182 137 174 139" stroke-width="6.8" />

  </g>
</svg>
