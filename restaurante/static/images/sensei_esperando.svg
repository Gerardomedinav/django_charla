<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradEsp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#080c14" />
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fcd34d" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="glassGradCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.95" />
    </linearGradient>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Fondo circular con borde radar -->
  <circle cx="100" cy="100" r="96" fill="url(#bgGradEsp)" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6 4" opacity="0.9" />
  <circle cx="100" cy="100" r="82" fill="none" stroke="#0284c7" stroke-width="1" stroke-dasharray="2 4" opacity="0.5" />

  <!-- Sombra inferior -->
  <ellipse cx="100" cy="182" rx="72" ry="12" fill="#030712" opacity="0.7" />

  <!-- Cuerpo y Hoodie Tech -->
  <path d="M 45 190 C 45 145, 70 135, 100 135 C 130 135, 155 145, 155 190 Z" fill="#1e293b" stroke="#334155" stroke-width="2" />
  <path d="M 82 136 Q 100 152 118 136 L 108 175 L 92 175 Z" fill="#0f172a" />
  <path d="M 88 136 Q 100 148 112 136" stroke="#38bdf8" stroke-width="2" fill="none" />

  <!-- Cintas del hoodie -->
  <line x1="94" y1="145" x2="93" y2="162" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
  <line x1="106" y1="145" x2="107" y2="162" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />

  <!-- Cabeza y Cuello -->
  <rect x="91" y="115" width="18" height="22" rx="4" fill="#d97706" />
  <ellipse cx="100" cy="92" rx="30" ry="34" fill="url(#skinGrad)" />

  <!-- Pelo y barba -->
  <path d="M 70 82 C 68 55, 100 48, 130 65 C 132 78, 126 84, 126 84 C 122 68, 102 60, 78 72 Z" fill="#1c1917" />
  <path d="M 76 96 C 76 122, 90 128, 100 128 C 110 128, 124 122, 124 96 C 124 112, 110 122, 100 122 C 90 122, 76 112, 76 96 Z" fill="#1c1917" opacity="0.9" />

  <!-- Boca expectante tranquila -->
  <line x1="93" y1="112" x2="107" y2="112" stroke="#78350f" stroke-width="2" stroke-linecap="round" />

  <!-- Anteojos Tech Azul Cyan -->
  <g filter="url(#glowCyan)">
    <rect x="74" y="82" width="22" height="15" rx="4" fill="url(#glassGradCyan)" stroke="#38bdf8" stroke-width="2" />
    <rect x="104" y="82" width="22" height="15" rx="4" fill="url(#glassGradCyan)" stroke="#38bdf8" stroke-width="2" />
    <line x1="96" y1="87" x2="104" y2="87" stroke="#38bdf8" stroke-width="2" />
    <!-- Líneas de scan radar en lentes -->
    <line x1="77" y1="89" x2="93" y2="89" stroke="#ffffff" stroke-width="1" stroke-linecap="round" opacity="0.7" />
    <line x1="107" y1="89" x2="123" y2="89" stroke="#ffffff" stroke-width="1" stroke-linecap="round" opacity="0.7" />
  </g>

  <!-- Tereré esperando -->
  <g transform="translate(132, 125)">
    <path d="M 6 22 L 9 52 C 10 57, 28 57, 29 52 L 32 22 Z" fill="#78350f" stroke="#451a03" stroke-width="1.5" />
    <ellipse cx="19" cy="22" rx="13" ry="3.5" fill="#94a3b8" />
    <ellipse cx="19" cy="22" rx="11" ry="2.5" fill="#15803d" />
    <line x1="17" y1="23" x2="7" y2="2" stroke="#e2e8f0" stroke-width="3" stroke-linecap="round" />
    <circle cx="6" cy="1" r="2" fill="#cbd5e1" />
  </g>

  <!-- Badge Estado: ESPERANDO DESAFÍO -->
  <g transform="translate(18, 20)">
    <rect x="0" y="0" width="80" height="20" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" />
    <circle cx="10" cy="10" r="4" fill="#38bdf8" />
    <text x="45" y="13.5" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="bold" fill="#38bdf8" text-anchor="middle">ESPERANDO</text>
  </g>
</svg>
