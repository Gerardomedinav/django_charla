<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradApr" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#080c14" />
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fcd34d" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="glassGradGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0.95" />
    </linearGradient>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Fondo circular con borde verde brillante -->
  <circle cx="100" cy="100" r="96" fill="url(#bgGradApr)" stroke="#10b981" stroke-width="2.5" />
  <circle cx="100" cy="100" r="86" fill="none" stroke="#34d399" stroke-width="1" stroke-dasharray="4 4" opacity="0.6" />

  <!-- Sombra inferior -->
  <ellipse cx="100" cy="182" rx="72" ry="12" fill="#030712" opacity="0.7" />

  <!-- Cuerpo y Hoodie Tech con detalles verdes -->
  <path d="M 45 190 C 45 145, 70 135, 100 135 C 130 135, 155 145, 155 190 Z" fill="#1e293b" stroke="#059669" stroke-width="2" />
  <path d="M 82 136 Q 100 152 118 136 L 108 175 L 92 175 Z" fill="#0f172a" />
  <path d="M 88 136 Q 100 148 112 136" stroke="#10b981" stroke-width="2.5" fill="none" />

  <!-- Cintas del hoodie -->
  <line x1="94" y1="145" x2="93" y2="162" stroke="#34d399" stroke-width="2" stroke-linecap="round" />
  <line x1="106" y1="145" x2="107" y2="162" stroke="#34d399" stroke-width="2" stroke-linecap="round" />

  <!-- Cabeza y Cuello -->
  <rect x="91" y="115" width="18" height="22" rx="4" fill="#d97706" />
  <ellipse cx="100" cy="92" rx="30" ry="34" fill="url(#skinGrad)" />

  <!-- Pelo y barba -->
  <path d="M 70 82 C 68 55, 100 48, 130 65 C 132 78, 126 84, 126 84 C 122 68, 102 60, 78 72 Z" fill="#1c1917" />
  <path d="M 76 96 C 76 122, 90 128, 100 128 C 110 128, 124 122, 124 96 C 124 112, 110 122, 100 122 C 90 122, 76 112, 76 96 Z" fill="#1c1917" opacity="0.9" />

  <!-- Sonrisa amplia aprobando -->
  <path d="M 90 108 Q 100 118 110 108" stroke="#78350f" stroke-width="2.5" stroke-linecap="round" fill="none" />

  <!-- Anteojos Tech Verdes Neón -->
  <g filter="url(#glowGreen)">
    <rect x="74" y="82" width="22" height="15" rx="4" fill="url(#glassGradGreen)" stroke="#10b981" stroke-width="2" />
    <rect x="104" y="82" width="22" height="15" rx="4" fill="url(#glassGradGreen)" stroke="#10b981" stroke-width="2" />
    <line x1="96" y1="87" x2="104" y2="87" stroke="#10b981" stroke-width="2.5" />
    <!-- Tilde / Checkmark en cristales -->
    <path d="M 80 89 L 84 93 L 91 85" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <path d="M 110 89 L 114 93 L 121 85" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>

  <!-- Tereré con burbujitas y menta fresca -->
  <g transform="translate(132, 125)">
    <path d="M 6 22 L 9 52 C 10 57, 28 57, 29 52 L 32 22 Z" fill="#78350f" stroke="#451a03" stroke-width="1.5" />
    <ellipse cx="19" cy="22" rx="13" ry="3.5" fill="#94a3b8" />
    <ellipse cx="19" cy="22" rx="11" ry="2.5" fill="#15803d" />
    <line x1="17" y1="23" x2="7" y2="2" stroke="#e2e8f0" stroke-width="3" stroke-linecap="round" />
    <circle cx="6" cy="1" r="2" fill="#cbd5e1" />
    <!-- Estrellita de éxito sobre el tereré -->
    <circle cx="28" cy="14" r="3" fill="#34d399" opacity="0.8" />
  </g>

  <!-- Badge Estado: ¡DESAFÍO SUPERADO! -->
  <g transform="translate(14, 18)">
    <rect x="0" y="0" width="88" height="22" rx="11" fill="#064e3b" stroke="#10b981" stroke-width="1.5" />
    <circle cx="11" cy="11" r="5" fill="#22c55e" />
    <text x="50" y="14.5" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="bold" fill="#ecfdf5" text-anchor="middle">✓ APROBADO</text>
  </g>
</svg>
